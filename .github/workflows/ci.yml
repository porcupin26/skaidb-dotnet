name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x']
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Build (library, tests, examples; library warnings are errors)
        run: dotnet build Skaidb.sln -c Release
      - name: Unit tests (xunit, in-process fake server, no skaidb needed)
        run: dotnet test tests/Skaidb.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Live test is skipped without a server
        run: dotnet run --project tests/Live -c Release --no-build
      - name: Package
        run: dotnet pack Skaidb.csproj -c Release --no-build -o artifacts
      - name: Hello version equals package version
        run: |
          ver="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Skaidb.csproj)"
          test -n "$ver" || { echo "::error::Skaidb.csproj has no <Version>"; exit 1; }
          test -f "artifacts/Skaidb.$ver.nupkg" || { echo "::error::expected artifacts/Skaidb.$ver.nupkg"; ls artifacts; exit 1; }
          unzip -p "artifacts/Skaidb.$ver.nupkg" Skaidb.nuspec | grep -q "<version>$ver</version>" || { echo "::error::nuspec version differs from $ver"; exit 1; }
          unzip -l "artifacts/Skaidb.$ver.nupkg" | grep -q ' README.md' || { echo "::error::README.md is not packed"; exit 1; }
          grep -q 'AssemblyInformationalVersionAttribute' Skaidb.cs || { echo "::error::Skaidb.cs no longer derives the Hello version from the assembly"; exit 1; }
          if grep -Eq '"[0-9]+\.[0-9]+\.[0-9]+"' Skaidb.cs; then echo "::error::Skaidb.cs contains a version literal"; exit 1; fi
          # The unit suite asserted DriverVersion == <Version> and that the
          # Hello frame carries it; this pins the packaged artifact to the same number.
          echo "Hello version source: Skaidb.csproj <Version>$ver</Version>"
      - uses: actions/upload-artifact@v4
        if: matrix.dotnet == '8.0.x'
        with:
          name: nupkg
          path: artifacts/*.nupkg
